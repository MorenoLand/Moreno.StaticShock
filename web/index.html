<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; background: #000; outline: none; }
</style>
</head>
<body>
<canvas id="canvas" width="{{WIDTH}}" height="{{HEIGHT}}" tabindex="0"></canvas>

<script>
  window.addEventListener('error', function (e) { console.log('[error] ' + e.message); });
  window.addEventListener('unhandledrejection', function (e) { console.log('[reject] ' + e.reason); });
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (text) { console.log(text); },
    printErr: function (text) { console.log(text); },
    onAbort: function (what) { console.log('[abort] ' + what); },
    onRuntimeInitialized: function () {
      window.__guestReady = true;
      Module.canvas.focus();
    }
  };
  (function () {
    var parts = {{DATA_PARTS}};
    function load(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = function () { reject(new Error(src)); };
        document.body.appendChild(s);
      });
    }
    function boot() {
      return load('web.js').then(function () { return load('host.js'); });
    }
    if (!parts) { boot().catch(function (e) { console.log('[load] ' + e); }); return; }
    var names = [];
    for (var i = 0; i < parts; ++i) names.push('host.data.part' + i);
    Promise.all(names.map(function (name) {
      return fetch(name).then(function (r) {
        if (!r.ok) throw new Error(name + ' ' + r.status);
        return r.arrayBuffer();
      });
    })).then(function (bufs) {
      var size = 0, i;
      for (i = 0; i < bufs.length; ++i) size += bufs[i].byteLength;
      var all = new Uint8Array(size), off = 0;
      for (i = 0; i < bufs.length; ++i) { all.set(new Uint8Array(bufs[i]), off); off += bufs[i].byteLength; }
      Module.getPreloadedPackage = function () { return all.buffer; };
      return boot();
    }).catch(function (e) { console.log('[load] ' + e); });
  })();
</script>
</body>
</html>
